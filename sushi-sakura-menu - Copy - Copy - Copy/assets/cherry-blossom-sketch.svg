<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bark" x1="80" y1="820" x2="1430" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a2527"/><stop offset=".48" stop-color="#7d3e4d"/><stop offset="1" stop-color="#b86a75"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdfd"/><stop offset=".58" stop-color="#f8cad5"/><stop offset="1" stop-color="#d66c87"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <g id="blossom" stroke="#b85a71" stroke-width="1.3" fill="url(#petal)">
      <ellipse cx="0" cy="-10" rx="8" ry="12"/><ellipse transform="rotate(72)" cx="0" cy="-10" rx="8" ry="12"/><ellipse transform="rotate(144)" cx="0" cy="-10" rx="8" ry="12"/><ellipse transform="rotate(216)" cx="0" cy="-10" rx="8" ry="12"/><ellipse transform="rotate(288)" cx="0" cy="-10" rx="8" ry="12"/>
      <circle r="4" fill="#c65f77" stroke="none"/><circle cx="1" cy="-1" r="1.1" fill="#fff6c7" stroke="none"/>
    </g>
    <g id="bud" fill="#e895a8"><circle r="6"/><circle cx="7" cy="-3" r="4.5"/><circle cx="-5" cy="-4" r="4"/></g>
  </defs>

  <!-- distant trunks add depth without competing with the menu -->
  <g opacity=".18" stroke="#9d5664" stroke-linecap="round">
    <path d="M1320 900C1294 687 1327 471 1460 188M1458 900c-34-218-24-386 89-565M118 900C167 690 145 494 42 300" stroke-width="15"/>
    <path d="M1334 602c-94-49-143-120-162-209M1377 477c87-43 135-98 162-171M1530 582c-65-34-108-85-136-148M100 565c76-52 116-119 130-199" stroke-width="6"/>
  </g>

  <!-- main, layered cherry-tree branches -->
  <g stroke="url(#bark)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-92 836C141 759 260 662 403 527 570 370 714 297 877 266c183-35 334-7 468-95 113-74 184-157 352-191" stroke-width="24"/>
    <path d="M-80 849C152 781 265 683 419 547 570 413 711 336 877 296c178-43 321-15 454-98" stroke="#f2cbd3" stroke-opacity=".42" stroke-width="5"/>
    <path d="M179 733c-22-123 9-221 93-330M369 562c-19-120 20-228 100-317M546 435c-10-106 33-201 109-276M730 344c-2-92 42-170 113-228M944 284c19-80 74-144 147-184M1152 243c45-66 106-108 184-129M1331 167c47-48 105-74 170-83" stroke-width="10"/>
    <path d="M277 658c-84 23-149 5-204-43M469 513c-88 18-155-6-207-58M649 399c-85 10-150-19-191-71M836 319c-76 11-133-13-174-58M1043 270c-67 9-115-12-149-45M1232 211c-57 8-101-6-133-34M1424 139c-51 7-89-5-119-30" stroke-width="7"/>
    <path d="M84 759c44-44 73-94 85-151M504 505c46-50 76-103 85-161M677 385c44-46 71-96 81-148M991 269c38-38 65-82 75-129M1219 215c39-32 70-69 87-109" stroke-width="4"/>
  </g>

  <!-- fine bark grain -->
  <g stroke="#fff4f4" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round">
    <path d="M31 789c99-35 191-86 272-153M187 745c83-52 146-102 204-160M395 576c74-71 137-121 216-157M594 437c78-58 147-93 221-111M820 334c68-30 136-43 207-44M1050 272c73-13 136-38 193-78"/>
  </g>

  <!-- soft blossom canopy -->
  <g fill="#f4aabb" opacity=".27" filter="url(#soft)">
    <circle cx="211" cy="617" r="57"/><circle cx="337" cy="515" r="66"/><circle cx="482" cy="401" r="62"/><circle cx="648" cy="308" r="70"/><circle cx="838" cy="266" r="64"/><circle cx="1020" cy="218" r="70"/><circle cx="1201" cy="163" r="61"/><circle cx="1406" cy="93" r="69"/>
  </g>

  <!-- individual blossoms and buds -->
  <g>
    <use href="#blossom" x="185" y="603"/><use href="#blossom" x="239" y="576" transform="rotate(18 239 576)"/><use href="#blossom" x="300" y="532" transform="scale(1.12) translate(-32 -46)"/>
    <use href="#blossom" x="361" y="479"/><use href="#blossom" x="414" y="456" transform="scale(.8) translate(104 112)"/><use href="#blossom" x="483" y="384" transform="scale(1.18) translate(-74 -60)"/>
    <use href="#blossom" x="553" y="365"/><use href="#blossom" x="615" y="319" transform="scale(.82) translate(136 70)"/><use href="#blossom" x="690" y="295" transform="scale(1.22) translate(-125 -53)"/>
    <use href="#blossom" x="764" y="290"/><use href="#blossom" x="842" y="256" transform="scale(.85) translate(147 45)"/><use href="#blossom" x="916" y="246" transform="scale(1.16) translate(-128 -34)"/>
    <use href="#blossom" x="1000" y="211"/><use href="#blossom" x="1080" y="205" transform="scale(.78) translate(304 58)"/><use href="#blossom" x="1160" y="172" transform="scale(1.2) translate(-193 -28)"/>
    <use href="#blossom" x="1240" y="163"/><use href="#blossom" x="1327" y="123" transform="scale(.84) translate(254 24)"/><use href="#blossom" x="1412" y="95" transform="scale(1.15) translate(-184 -13)"/>
    <use href="#bud" x="150" y="654"/><use href="#bud" x="270" y="582"/><use href="#bud" x="446" y="418"/><use href="#bud" x="586" y="351"/><use href="#bud" x="735" y="268"/><use href="#bud" x="887" y="235"/><use href="#bud" x="1066" y="182"/><use href="#bud" x="1281" y="129"/>
  </g>

  <!-- drifting petals -->
  <g fill="#d66c87" opacity=".62"><ellipse cx="294" cy="733" rx="5" ry="9" transform="rotate(35 294 733)"/><ellipse cx="445" cy="633" rx="4" ry="7" transform="rotate(-25 445 633)"/><ellipse cx="573" cy="548" rx="5" ry="8" transform="rotate(60 573 548)"/><ellipse cx="810" cy="467" rx="4" ry="7" transform="rotate(22 810 467)"/><ellipse cx="1018" cy="382" rx="5" ry="8" transform="rotate(-32 1018 382)"/><ellipse cx="1220" cy="322" rx="4" ry="7" transform="rotate(43 1220 322)"/><ellipse cx="1438" cy="231" rx="5" ry="9" transform="rotate(-18 1438 231)"/></g>
</svg>
